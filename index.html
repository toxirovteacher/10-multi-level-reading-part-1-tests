<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDUNEST · Multi Level Reading Part 1 — Homework Pack 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E3101F;--red-d:#B30C18;--red-l:#FDECEE;--navy:#141B2D;--navy-2:#222B42;--ink:#1B2233;--mute:#6B7280;
  --paper:#F6F4F1;--card:#FFFFFF;--line:#E7E2DB;--green:#159947;--green-l:#E6F6EC;--amber:#D98A06;--amber-l:#FFF4DC;
  --blue:#2457D6;--blue-l:#E8EEFC;--head:#141B2D;--solid:#141B2D;--ink2:#3d4556;--zebra:var(--zebra);--hover:var(--hover);--track:#EFEBE5;--barbg:var(--barbg);--coverbg:var(--coverbg);--input:#fff;--shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  --disp:'Oswald','Arial Narrow',Impact,sans-serif;--body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.hide{display:none!important}
.uz{color:var(--ink2);font-size:.92em;border-left:3px solid var(--red);padding-left:10px;margin-top:6px}
body:not(.uz-on) .uz{display:none}
.uz .flag{font-weight:700;color:var(--red);font-size:.75em;letter-spacing:.06em;margin-right:6px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,28px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:38px;width:auto}
.brand .bt{font-family:var(--disp);font-weight:700;letter-spacing:.04em;color:var(--red);font-size:20px;line-height:1}
.brand .bs{font-size:11px;letter-spacing:.14em;color:var(--head);text-transform:uppercase;font-weight:700;margin-top:3px;white-space:nowrap}
.topbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--card);white-space:nowrap}
.pill.who{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.uzbtn{border:1.5px solid var(--head);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.uzbtn .dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
body.uz-on .uzbtn{background:var(--solid);color:#fff}
body.uz-on .uzbtn .dot{background:#3BD16F}
.navbtn{font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px}
.navbtn:hover{background:var(--paper)}

/* ---------- generic ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:22px clamp(14px,3vw,28px) 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;transition:transform .12s,box-shadow .12s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(227,16,31,.28)}
.btn.red:hover{background:var(--red-d)}
.btn.navy{background:var(--solid);color:#fff}
.btn.ghost{border:1.5px solid var(--line);background:var(--card)}
.btn.ghost:hover{border-color:var(--head)}
.btn[disabled]{opacity:.45;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--red)}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:.01em;color:var(--head);line-height:1.15}
h1{font-size:clamp(30px,5vw,46px)} h2{font-size:clamp(22px,3.4vw,30px)} h3{font-size:20px}
.muted{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--solid);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim>*{animation:up .45s both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.hero:before{content:"";position:absolute;right:-30%;top:-20%;width:90%;height:150%;background:var(--red);transform:rotate(18deg);opacity:.95}
.hero:after{content:"";position:absolute;right:-34%;top:-20%;width:90%;height:150%;border-left:2px solid rgba(255,255,255,.35);transform:rotate(18deg)}
.hero>*{position:relative;z-index:2}
.logo-card{background:#fff;border-radius:20px;padding:16px 18px;display:inline-flex;box-shadow:0 18px 40px rgba(0,0,0,.25);width:max-content}
.logo-card img{height:110px}
.hero h1{color:#fff;font-size:clamp(32px,4.2vw,54px);font-weight:700;line-height:1.02;text-transform:uppercase}
.hero h1 span{font-size:.8em;color:var(--red);background:var(--card);padding:0 .18em;border-radius:6px;display:inline-block;margin-top:6px}
.hero .lead{font-size:17px;max-width:480px;color:#e6e9f2;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.teacher{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 16px;max-width:430px;backdrop-filter:blur(4px)}
.teacher .av{width:52px;height:52px;border-radius:14px;background:var(--card);color:var(--red);font-family:var(--disp);font-size:24px;font-weight:700;display:grid;place-items:center;flex:none}
.teacher b{display:block;font-size:17px}
.teacher small{display:block;color:#cdd3e1;font-size:13px}
.lvl{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.form-side{display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,60px)}
.form{width:100%;max-width:420px}
.form h2{margin:8px 0 6px}
.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--head)}
.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;background:var(--card);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--red-l)}
.howto{margin-top:22px;display:grid;gap:10px}
.howto div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.howto i{flex:none;width:26px;height:26px;border-radius:8px;background:var(--red-l);color:var(--red);font-style:normal;font-weight:800;display:grid;place-items:center;font-size:13px}

/* ---------- dashboard ---------- */
.dash-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 24px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--disp);font-size:30px;font-weight:600;color:var(--head);line-height:1.1}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpi .bar{height:6px;border-radius:9px;background:var(--paper);margin-top:10px;overflow:hidden}
.kpi .bar b{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tcard{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-3px);border-color:#d6cfc5;box-shadow:0 14px 30px rgba(20,27,45,.12)}
.tcard .num{font-family:var(--disp);font-size:44px;font-weight:700;line-height:.9;color:var(--red)}
.tcard .ttl{font-weight:700;font-size:16px;color:var(--head);line-height:1.25;min-height:40px}
.tcard .row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--paper);color:var(--mute);display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:var(--green-l);color:var(--green)}
.tag.warn{background:var(--amber-l);color:var(--amber)}
.tag.red{background:var(--red-l);color:var(--red)}
.tag.blue{background:var(--blue-l);color:var(--blue)}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.steps2 span{height:6px;border-radius:9px;background:var(--paper)}
.steps2 span.on{background:var(--red)}
.steps2 span.done{background:var(--green)}
.tcard .go{margin-top:auto;font-size:13px;font-weight:800;color:var(--head);display:flex;justify-content:space-between;align-items:center}
.tcard.complete:after{content:"✓";position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.reset{font-size:11px;color:var(--mute);text-decoration:underline}
.reportcta{margin-top:22px;padding:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(120deg,var(--navy) 0 62%,var(--red) 62%);color:#fff;border:0}
.reportcta h3{color:#fff}
.reportcta p{color:#d6dbe7;font-size:14px}

/* ---------- test ---------- */
.testbar{position:sticky;top:59px;z-index:30;background:var(--barbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.testbar .in{max-width:1080px;margin:0 auto;padding:10px clamp(14px,3vw,28px);display:flex;align-items:center;gap:12px}
.testbar .t{font-weight:800;color:var(--head);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:800;font-style:normal;color:var(--mute);transition:.2s}
.dots i.f{background:var(--solid);border-color:var(--head);color:#fff}
.rec{font-size:12px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.rec:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.instr{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.instr .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--disp);font-size:18px}
.instr b{color:var(--head)}
.passage{padding:clamp(18px,4vw,40px);position:relative}
.passage .ptitle{text-align:center;font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.2vw,30px);color:var(--head);margin-bottom:6px}
.passage .pline{width:60px;height:3px;background:var(--red);margin:0 auto 22px;border-radius:3px}
.ptext{font-family:var(--serif);font-size:clamp(17px,2vw,19.5px);line-height:2.05;color:var(--ink)}
.ptext p+p{margin-top:16px}
.gap{display:inline-flex;align-items:center;gap:0;vertical-align:baseline;white-space:nowrap}
.gap b{font-family:var(--body);font-size:12px;background:var(--solid);color:#fff;border-radius:7px 0 0 7px;padding:0 7px;height:32px;display:inline-grid;place-items:center}
.gap input{background:var(--input)!important;width:clamp(110px,22vw,150px);height:32px;border:2px solid var(--head);border-left:0;border-radius:0 8px 8px 0;padding:0 9px;font-family:var(--body);font-size:16px;font-weight:600;color:var(--head);outline:none;background:var(--card);transition:.15s}
.gap input:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--red-l)}
.gap input:focus+.x{display:none}
.gap.filled b{background:var(--red)}
.gl{border-bottom:2px dotted var(--blue);cursor:help}
body:not(.uz-on) .gl{border-bottom-color:transparent;cursor:text}
.pop{position:absolute;z-index:60;background:var(--solid);color:#fff;border-radius:12px;padding:9px 13px;font-size:14px;max-width:260px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:up .18s both}
.pop small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9aa6c2;font-weight:700}
.pop:after{content:"";position:absolute;left:var(--ax,20px);bottom:-6px;width:12px;height:12px;background:var(--solid);transform:rotate(45deg)}
.pop.below:after{bottom:auto;top:-6px}
.cover{position:absolute;inset:0;z-index:5;background:var(--coverbg);backdrop-filter:blur(9px);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:20px}
.startcard{max-width:520px;width:100%;padding:26px;text-align:left}
.rules{display:grid;gap:10px;margin:16px 0 20px}
.rules div{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.rules i{flex:none;font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--paper);display:grid;place-items:center}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:12px clamp(14px,3vw,28px) calc(12px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}

/* ---------- result ---------- */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:24px;padding:24px;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--disp);font-size:46px;color:var(--head);line-height:1;display:block}
.ring .c small{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.mini div{background:var(--paper);border-radius:14px;padding:12px}
.mini b{display:block;font-family:var(--disp);font-size:24px;color:var(--head);line-height:1.1}
.mini span{font-size:11.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.timeline{margin-top:14px;background:var(--paper);border-radius:999px;height:14px;position:relative}
.timeline .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width 1s}
.timeline .tgt{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--solid)}
.timeline .tgt:after{content:attr(data-l);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap;color:var(--head)}
.qrev{display:grid;gap:10px;margin-top:16px}
.qr{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.qr .n{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px}
.qr.ok .n{background:var(--green)} .qr.no .n{background:var(--red)}
.qr .ans{font-weight:700}
.qr .ans s{color:var(--red);text-decoration-thickness:2px}
.qr .ev{font-family:var(--serif);font-size:15px;color:var(--ink2);margin-top:6px;background:var(--paper);border-radius:10px;padding:8px 10px}
.qr .ev mark{color:#1B2233;background:#FFE36E;padding:0 3px;border-radius:4px;font-weight:600}
.fb{padding:20px;margin-top:16px}
.fb ul{list-style:none;display:grid;gap:10px;margin-top:10px}
.fb li{display:flex;gap:10px;align-items:flex-start}
.fb li i{flex:none;font-style:normal;font-size:18px;line-height:1.3}

/* ---------- KWT ---------- */
.stepper{display:flex;gap:8px;margin:4px 0 18px;flex-wrap:wrap}
.stepper div{flex:1;min-width:150px;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);display:flex;gap:8px;align-items:center}
.stepper div i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px}
.stepper div.on{border-color:var(--red);color:var(--head)}
.stepper div.on i{background:var(--red);color:#fff}
.stepper div.done{color:var(--green)}
.stepper div.done i{background:var(--green);color:#fff}
.kwt-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.kwt-table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);text-align:left;padding:0 12px}
.kwt-table td{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:middle}
.kwt-table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;width:40px;font-weight:800;color:var(--red);font-family:var(--disp);font-size:20px;text-align:center}
.kwt-table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0;width:56px;text-align:center}
.pw{font-weight:800;color:var(--head);font-size:16px}
.ctx{font-family:var(--serif);font-size:13.5px;color:var(--mute);margin-top:2px}
.ctx b{color:#1B2233!important;color:var(--head);background:#FFF3B0;border-radius:3px;padding:0 2px}
.arrow{color:var(--red);font-weight:800;font-size:18px;text-align:center;width:30px}
.slot{min-height:44px;border:2px dashed #cfc7bb;border-radius:12px;display:flex;align-items:center;padding:6px 12px;font-weight:700;color:#a49a8c;cursor:pointer;transition:.15s;font-size:15px;width:100%;text-align:left}
.slot.sel{border-color:var(--red);background:var(--red-l);color:var(--red)}
.slot.full{border-style:solid;border-color:var(--head);color:var(--head);background:var(--card)}
.slot.right{border-color:var(--green);background:var(--green-l);color:var(--green);cursor:default}
.slot.rev{border-color:var(--amber);background:var(--amber-l);color:var(--amber);cursor:default}
.slot.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.uzb{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);font-size:11px;font-weight:800;color:var(--head)}
.uzb:hover{border-color:var(--head)}
.uzline{font-size:13px;color:var(--blue);font-weight:600;margin-top:3px}
.bank{position:sticky;bottom:78px;z-index:20;padding:14px;margin-top:10px;background:var(--card)}
.bank .chips2{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--head);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px;color:var(--head);background:var(--card);transition:.15s}
.chip:hover{background:var(--paper)}
.chip.sel{background:var(--solid);color:#fff;transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,27,45,.25)}
.chip.used{display:none}
.hunt-q{padding:18px 20px;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;border-left:5px solid var(--red)}
.hunt-q{position:sticky;top:70px;z-index:15}
.hunt-q .qn{font-family:var(--disp);font-size:30px;color:var(--red);line-height:1}
.hunt-q .s{font-size:18px;font-weight:600;color:var(--head)}
.hunt-q .s u{color:#1B2233;text-decoration:none;background:linear-gradient(transparent 55%,#FFD84D 55%);padding:0 2px}
.tok{cursor:pointer;border-radius:4px;transition:background .15s}
.tok:hover{background:var(--hover)}
.tok.ans{font-weight:700;color:var(--red)}
.tok.found{background:var(--green-l);color:var(--green);font-weight:700;box-shadow:0 0 0 2px var(--green-l)}
.tok.revealed{background:var(--amber-l);color:var(--amber);font-weight:700}
.tok.bad{background:#ffd5d9;animation:shake .35s}

The vault is built more than 100 metres inside a mountain. Even if the electricity stops working, the seeds will stay cold, because the rock and ice of the {3} are naturally frozen. Inside, the temperature is kept at minus 18 degrees Celsius. At this {4}, many seeds can stay alive for hundreds of years. The building is not very big, and most of the time its doors stay closed. Workers open the {5} only a few times a year, when new seeds arrive. Some people call it the Doomsday Vault, because it could help humans {6} food again after a global disaster.`,

text:`In the past, most people travelled to an office every day. Today, however, millions of people have {1} which allow them to work from home, at least for part of the week. Thanks to the internet, they can join meetings online and send documents in seconds. This is especially popular among people with office jobs.

{id:5,title:"Bamboo",ans:["day","grass","build","steel","panda","protect"],types:["N","N","V","N","N","V"],
text:`Bamboo is one of the fastest-growing plants on Earth. Some types can grow almost one metre in a single {1}. Although it looks like a tree, bamboo is actually a kind of grass. This {2} grows mainly in warm and wet parts of Asia, Africa and South America.

For thousands of years, people have used bamboo to {3} houses, bridges and furniture. It is light but very strong. In fact, some types are almost as strong as {4}. Unlike steel, however, bamboo grows back quickly after it is cut. Its strong roots also protect the soil from heavy rain and wind, and it is easy to build with.

Bamboo is also very important for wildlife. Giant pandas in China eat almost nothing else. A single {5} can eat more than twelve kilograms of bamboo every day, which is why a panda spends most of its time eating. Because bamboo grows so fast and needs little care, many people believe it could help to {6} the environment in the future, for example as a replacement for plastic.`,

{id:6,title:"Coral Reefs in Danger",ans:["corals","ocean","plants","die","fish","gardens"],types:["P","N","P","V","N","P"],
text:`Coral reefs are some of the most beautiful places in the ocean. They look like colourful rocks, but they are actually made by millions of tiny animals called corals. These {1} live together in large groups and build hard skeletons around their bodies. Although reefs cover less than one percent of the ocean floor, they are home to about a quarter of all the animals that live in the {2}.

{id:7,title:"Why People Volunteer",ans:["time","summer","friends","experience","shelter","make"],types:["N","N","P","N","N","V"],
text:`Volunteers are people who work without pay to help others. Every year, millions of people around the world give their free {1} to hospitals, schools, parks and animal shelters. Some volunteers help for just a few hours a month, while others spend their whole {2} holiday abroad.

text:`Today, millions of us use bicycles every day, but the first bicycle looked very different. It was invented in Germany in 1817 by a man called Karl Drais. His {1} had two wheels and a wooden frame, but it had no pedals. Riders pushed the ground with their {2}, just like children on a scooter.

{id:10,title:"Emperor Penguins",ans:["penguins","male","huddle","take","chick","weight"],types:["P","N","N","V","N","N"],
text:`Emperor penguins live in Antarctica, the coldest place on Earth. They are the largest penguins in the world, and an adult can reach a weight of about 40 kilograms. In winter, the temperature there can fall to minus 40 degrees Celsius. Surprisingly, this is the time when emperor {1} lay their eggs. After the female lays a single egg, she gives it to the male and goes to the sea to find food. The {2} then keeps the egg warm on his feet for about two months.

During this time, the males do not eat anything. To survive the cold, they stand close together in large groups called huddles. Inside a huddle, the temperature can rise above 20 degrees Celsius. However, only the birds in the middle of a {3} stay warm, while those on the outside feel the cold wind. So the birds keep moving slowly, and every penguin can {4} a turn in the warm middle.

When the chick comes out of the egg, the female returns from the sea with food. She feeds the {5}, while the hungry male finally walks to the sea to eat. This journey can take several days. By then, the male may have lost almost half of his body {6}.`,

function sha256(s){s=unescape(encodeURIComponent(s));function r(v,a){return(v>>>a)|(v<<(32-a))}
var mp=Math.pow,mw=mp(2,32),res='',words=[],abl=s.length*8,hash=[],k=[],pc=0,ic={},i,j;
for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
s+='\x80';while(s.length%64-56)s+='\x00';
for(i=0;i<s.length;i++){j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=((abl/mw)|0);words[words.length]=abl;
for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);
var t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}

async function doPush(){if(!CLOUD_URL||!S)return;const snap=JSON.parse(JSON.stringify(S));delete snap.unsynced;
  try{const r=await fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({action:'save',key:S.key,data:snap})});const j=await r.json();if(j.ok){S.unsynced=false;store(STORE+'s:'+S.key,JSON.stringify(S));updSync()}}catch(e){updSync()}}

async function syncFromCloud(){if(!CLOUD_URL||!S)return;try{const j=await cloudGet({action:'get',id:S.key});const c=j&&j.student;
  if(c&&c.updated&&(!S.updated||c.updated>S.updated)&&!S.unsynced){const keepProg={};Object.entries(S.tests).forEach(([k,v])=>{if(v.prog&&!(c.tests[k]&&c.tests[k].res))keepProg[k]=v.prog});S=c;Object.entries(keepProg).forEach(([k,p])=>{S.tests[k]=S.tests[k]||{};S.tests[k].prog=p});store(STORE+'s:'+S.key,JSON.stringify(S));return true}
  if(S.unsynced||!c)pushCloud();}catch(e){}return false}

  switch(h[0]){
    case'test':if(d.res){go('#/result/'+id,true);return}setBack('#/home');cur=id;testView(id);break;

}

function liveTest(){return cur&&ui.mode==='test'&&S&&S.tests[cur]&&S.tests[cur].prog&&S.tests[cur].prog.started}
function pauseClock(){if(!liveTest())return;const pr=S.tests[cur].prog;if(pr.seg){pr.acc+=Date.now()-pr.seg;pr.seg=null;save()}}
function resumeClock(){if(!liveTest())return;const pr=S.tests[cur].prog;if(!pr.seg){pr.seg=Date.now();save()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(liveTest())S.tests[cur].prog.blurs++;pauseClock()}else resumeClock()});

function stats(D){
  const doneT=TESTS.filter(t=>D.tests[t.id]&&D.tests[t.id].res);
  const score=doneT.reduce((a,t)=>a+D.tests[t.id].res.score,0);
  const time=doneT.reduce((a,t)=>a+D.tests[t.id].res.time,0);
  const kw=TESTS.filter(t=>D.tests[t.id]&&D.tests[t.id].kwt);
  const kwOk=kw.reduce((a,t)=>a+D.tests[t.id].kwt.tFirst+D.tests[t.id].kwt.hFirst,0);
  const kwTot=kw.reduce((a,t)=>a+D.tests[t.id].kwt.tTotal+D.tests[t.id].kwt.hTotal,0);
  return{done:doneT,score,time,kw,kwOk,kwTot,complete:kw.length,acc:doneT.length?Math.round(score/(doneT.length*6)*100):0,kwPct:kwTot?Math.round(kwOk/kwTot*100):null};
}

function showPop(el,uz,w){hidePop();const r=el.getBoundingClientRect();const p=document.createElement('div');p.className='pop';p.innerHTML=`<small>${esc(w)} · o‘zbekcha</small>${esc(uz)}`;document.body.appendChild(p);

function confirmSubmit(id){

function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const IRR={feet:'foot',foot:'feet'};
function classify(t,i,u){
  const a=t.ans[i];u=norm(u);
  if(!u)return'blank';if(u===a)return'ok';
  if(u.split(' ').length>1)return'multi';
  if(u+'s'===a||a+'s'===u||u+'es'===a||a+'es'===u||IRR[u]===a)return'plural';
  if(a.length>=4&&lev(u,a)<=2)return'spelling';
  if(!new RegExp('\\b'+reEsc(u)+'\\b','i').test(t.text.replace(/\{\d\}/g,' ')))return'notext';
  return'wrong';
}
const CAT={ok:['Correct','To‘g‘ri'],blank:['Left empty','Bo‘sh qoldirilgan'],plural:['Singular / plural mistake','Birlik / ko‘plik xatosi'],spelling:['Spelling mistake','Imlo xatosi'],notext:['Word is not in the text','Bu so‘z matnda yo‘q'],wrong:['Wrong word from the text','Matndagi noto‘g‘ri so‘z'],multi:['More than one word','Bittadan ortiq so‘z']};
function submit(id){
  const t=T(id),d=S.tests[id],pr=d.prog;pauseClock();ui.mode=null;
  const ans=pr.ans.map(a=>a.trim());const cat=ans.map((a,i)=>classify(t,i,a));
  d.res={ans,cat,score:cat.filter(c=>c==='ok').length,time:Math.max(1000,pr.acc),blurs:pr.blurs,uz:pr.uz,at:Date.now()};
  delete d.prog;save(true);go('#/result/'+id,true);
}

function evidence(t,i){const g=t.text.replace(/\{(\d)\}/g,'_____').replace(/\n\n/g,' ');const sents=g.match(/[^.!?]+[.!?]+/g)||[g];const re=new RegExp('\\b('+reEsc(t.ans[i])+')\\b','i');const s=sents.find(x=>re.test(x));return s?esc(s.trim()).replace(re,'<mark>$1</mark>'):''}
function ring(val,max,color,size=170){const r=size/2-12,c=2*Math.PI*r,p=max?val/max:0;return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="14"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" class="rg" data-o="${c*(1-p)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>`}
function animRings(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.rg').forEach(e=>e.style.strokeDashoffset=e.dataset.o)))}
function speed(ms){const m=ms/60000;if(m<TARGET_MIN*0.5)return['⚡ Very fast','Juda tez','var(--amber)'];if(m<=TARGET_MIN)return['✅ On target','Me’yorda','var(--green)'];if(m<=TARGET_MIN*1.5)return['🐢 A bit slow','Biroz sekin','var(--amber)'];return['⏳ Too slow','Juda sekin','var(--red)']}
function testFeedback(t,r){

  else if(pct>=.66)f.push(['👍','Good work — check the red answers and read the sentence where the word appears.','Yaxshi! Qizil javoblarni va so‘z uchragan gapni qayta o‘qing.']);
  else f.push(['📌','This text was difficult for you. Read it again slowly and find each answer in the text.','Bu matn qiyin bo‘ldi. Qayta sekin o‘qib, har bir javobni matndan toping.']);
  if(c.includes('plural'))f.push(['🔤','Singular/plural mistake: look at the words around the gap — <b>a / one / single</b> → singular, <b>these / many / their</b> → often plural.','Birlik/ko‘plik xatosi: bo‘sh joy atrofiga qarang — a / one / single → birlik; these / many → ko‘plik.']);
  if(c.includes('spelling'))f.push(['✍️','Spelling mistake: the answer is already in the text — copy it letter by letter.','Imlo xatosi: javob matnda bor — harfma-harf ko‘chiring.']);
  if(c.includes('notext'))f.push(['🔎','You used a word that is NOT in the text. Remember: the answer is always somewhere in the text.','Matnda yo‘q so‘z ishlatdingiz. Qoida: javob doim matnning o‘zida bo‘ladi.']);
  if(c.includes('blank'))f.push(['⛔','Never leave a gap empty — a word from the text is always better than nothing.','Hech qachon bo‘sh qoldirmang.']);
  if(c.includes('multi'))f.push(['1️⃣','ONE word only. Two words = wrong answer in the exam.','Faqat BITTA so‘z. Ikki so‘z — xato.']);
  const m=r.time/60000;
  if(m<TARGET_MIN*0.5&&r.score<5)f.push(['⚡','You were very fast but lost points. Slow down and check each gap.','Juda tez ishladingiz, lekin ball yo‘qotdingiz. Shoshilmang.']);

  return f;
}

/* ================== KEY WORD TABLE ================== */
function stepper(n){const L=[['Build the table','Jadvalni tuzing'],['Paraphrase hunt','Sinonimni toping'],['My Key Word Table','Mening jadvalim']];
  return `<div class="stepper">${L.map((l,i)=>`<div class="${i+1<n?'done':i+1===n?'on':''}"><i>${i+1<n?'✓':i+1}</i><span>${l[0]}<span class="uz" style="display:block;border:0;padding:0;margin:0;font-size:11px">${l[1]}</span></span></div>`).join('')}</div>`}
function fullText(t){return t.text.replace(/\{(\d)\}/g,(m,n)=>t.ans[n-1])}
function context(t,w){
  const s=(fullText(t).replace(/\n\n/g,' ').match(/[^.!?]+[.!?]+/g)||[]);const re=new RegExp('\\b('+reEsc(w)+')\\b','i');
  let x=(s.find(z=>re.test(z))||'').trim();const m=x.search(re);
  if(x.length>95){let a=Math.max(0,m-40),b=Math.min(x.length,m+w.length+45);x=(a>0?'…':'')+x.slice(a,b).replace(/^\S*\s/,a>0?'':'$&')+(b<x.length?'…':'')}
  return esc(x).replace(re,'<b>$1</b>');
}
function kwtStep1(id){

  ui.k=k;
  view().innerHTML=`<div class="wrap">
    <div class="eyebrow">Test ${id} · ${esc(t.title)}</div><h2>🔑 Key Word Table</h2>
    ${stepper(1)}
    <div class="helper"><span class="hi">👆</span><div><b>Every word on the left is from the text. Find a word or phrase with a SIMILAR MEANING in the word bank and put it in the table.</b>

function analyse(D){
  const st=stats(D);const n=st.done.length;
  const cats={};const typ={N:[0,0],P:[0,0],V:[0,0]};let blurs=0,uz=0;
  st.done.forEach(t=>{const r=D.tests[t.id].res;blurs+=r.blurs;uz+=r.uz;r.cat.forEach((c,i)=>{cats[c]=(cats[c]||0)+1;typ[t.types[i]][1]++;if(c==='ok')typ[t.types[i]][0]++})});
  const order=st.done.map(t=>({t,r:D.tests[t.id].res})).sort((a,b)=>a.r.at-b.r.at);
  let growth=null;if(order.length>=4){const h=Math.floor(order.length/2);const a=order.slice(0,h).reduce((s,x)=>s+x.r.score,0)/h,b=order.slice(-h).reduce((s,x)=>s+x.r.score,0)/h;growth=Math.round((b-a)/6*100)}
  return{...st,n,cats,typ,blurs,uz,order,growth,avg:n?st.time/n:0};
}
function lvlOf(acc){return acc>=90?['Excellent','A’lo','var(--green)']:acc>=75?['Very good','Juda yaxshi','var(--green)']:acc>=55?['Good — needs practice','Yaxshi — mashq kerak','var(--amber)']:['Needs serious work','Jiddiy ishlash kerak','var(--red)']}
function barChart(D){

    ${TESTS.map((t,i)=>{const r=D.tests[t.id]&&D.tests[t.id].res;const h=r?Math.max(4,r.score/6*H):H;const c=!r?'var(--track)':r.score>=5?'#159947':r.score>=3?'#D98A06':'#E3101F';

function timeChart(D,A){

function advice(A){

  const tw=Object.entries(A.typ).filter(([k,v])=>v[1]).map(([k,v])=>[k,v[0]/v[1]]).sort((a,b)=>a[1]-b[1]);
  if(tw.length&&tw[0][1]<1)adv.push(['🧩',`Weakest gap type: <b>${TYPE_NAME[tw[0][0]]}s</b> (${Math.round(tw[0][1]*100)}%). Ask: noun or verb? one or many?`,`Eng zaif tur: ${TYPE_UZ[tw[0][0]]} (${Math.round(tw[0][1]*100)}%).`]);
  const c=A.cats;
  if(c.plural)adv.push(['🔤',`<b>${c.plural}</b> singular/plural mistake${c.plural>1?'s':''}. Check a, one, these, many, their.`,`${c.plural} ta birlik/ko‘plik xatosi.`]);

  if(c.notext)adv.push(['🔎',`<b>${c.notext}</b> answer${c.notext>1?'s were':' was'} not in the text. Always find your word in the text first.`,`${c.notext} ta javob matnda yo‘q edi.`]);

  if(A.kwPct!=null)adv.push(['🔑',A.kwPct>=80?`Key Word Tables: <b>${A.kwPct}%</b> first try — great paraphrase spotting.`:`Key Word Tables: <b>${A.kwPct}%</b> first try. Review the tables every day.`,A.kwPct>=80?`Kalit so‘zlar: ${A.kwPct}% — a’lo.`:`Kalit so‘zlar: ${A.kwPct}%. Jadvallarni har kuni takrorlang.`]);

    <div class="kpis" style="margin-top:16px">
      <div class="card kpi"><div class="l">Accuracy</div><div class="v">${A.acc}%</div><div class="bar"><b style="width:${A.acc}%;background:var(--green)"></b></div></div>
      <div class="card kpi"><div class="l">Total test time</div><div class="v" style="font-size:24px">${fmtLong(A.time)}</div></div>
      <div class="card kpi"><div class="l">Average / test</div><div class="v">${fmt(A.avg)}</div><div class="muted" style="font-size:12px;font-weight:600">fastest T${times[0][0].id} ${fmt(times[0][1])} · slowest T${times[times.length-1][0].id} ${fmt(times[times.length-1][1])}</div></div>
      <div class="card kpi"><div class="l">Key Word Tables</div><div class="v">${A.kwPct!=null?A.kwPct+'%':'—'}</div><div class="muted" style="font-size:12px;font-weight:600">${A.kw.length} done · first-try</div></div>
    </div>
    <div class="card sec" style="margin-top:0"><h3>📈 Growth · O‘sish</h3>${growthChart(A)}</div>
    <div class="two">
      <div class="card sec"><h3>Score per test</h3>${barChart(D)}</div>
      <div class="card sec"><h3>Time per test</h3>${timeChart(D,A)}</div>
    </div>
    <div class="two">
      <div class="card sec"><h3>Accuracy by gap type</h3>
        ${Object.entries(A.typ).filter(([k,v])=>v[1]).map(([k,v])=>{const p=Math.round(v[0]/v[1]*100);return `<div class="hbar"><span>${TYPE_NAME[k]}<span class="uz" style="display:block;border:0;padding:0;margin:0;font-size:11px">${TYPE_UZ[k]}</span></span><div class="tr"><b style="width:${p}%;background:${p>=80?'var(--green)':p>=60?'var(--amber)':'var(--red)'}"></b></div><b>${v[0]}/${v[1]}</b></div>`}).join('')}</div>
      <div class="card sec"><h3>Mistake types</h3>
        ${mistakes.length?mistakes.map(([c,v])=>`<div class="hbar"><span>${CAT[c][0]}<span class="uz" style="display:block;border:0;padding:0;margin:0;font-size:11px">${CAT[c][1]}</span></span><div class="tr"><b style="width:${v/maxM*100}%;background:var(--red)"></b></div><b>${v}</b></div>`).join(''):'<p style="margin-top:12px">🏆 No mistakes!</p>'}
        <div class="hbar"><span>Left the page</span><div class="tr"><b style="width:${Math.min(100,A.blurs*10)}%;background:var(--solid)"></b></div><b>${A.blurs}</b></div>
        <div class="hbar"><span>UZ help used</span><div class="tr"><b style="width:${Math.min(100,A.uz*3)}%;background:var(--blue)"></b></div><b>${A.uz}</b></div></div>
    </div>
    <div class="card sec fb"><h3>💬 Feedback</h3><ul>${advice(A).map(f=>`<li><i>${f[0]}</i><div>${f[1]}<div class="uz"><span class="flag">UZ</span>${f[2]}</div></div></li>`).join('')}</ul></div>
    <div class="card sec"><h3>All tests</h3><div style="overflow-x:auto"><table class="rtable"><thead><tr><th>#</th><th>Text</th><th>Score</th><th>Time</th><th>Key Word</th>${opt.teacher?'<th>Answers (1–6)</th><th></th>':'<th>Left page</th>'}</tr></thead><tbody>
      ${TESTS.map(t=>{const d=D.tests[t.id]||{};const r=d.res,k=d.kwt;return `<tr><td><b>${t.id}</b></td><td>${esc(t.title)}${d.prog&&d.prog.started&&!r?' <span class="tag warn">in progress</span>':''}</td><td>${r?`<b style="color:${r.score>=5?'var(--green)':r.score>=3?'var(--amber)':'var(--red)'}">${r.score}/6</b>`:'<span class="muted">—</span>'}</td><td>${r?fmt(r.time):'—'}</td><td>${k?Math.round((k.tFirst+k.hFirst)/(k.tTotal+k.hTotal)*100)+'%':'—'}</td>
        ${opt.teacher?`<td>${r?`<div class="detail-q">${t.ans.map((a,i)=>`<span class="${r.cat[i]==='ok'?'y':'n'}" title="correct: ${esc(a)}">${esc(r.ans[i]||'—')}</span>`).join('')}</div>`:'—'}</td><td>${r?`<button class="btn ghost" style="min-height:38px;padding:6px 10px;font-size:13px" data-reset="${t.id}">↺ Reset</button>`:''}</td>`:`<td>${r?r.blurs:'—'}</td>`}</tr>`}).join('')}</tbody></table></div></div>`;
}
function reportText(D){const A=analyse(D);const lvl=lvlOf(A.acc);
  return [`EDUNEST · MULTI LEVEL READING PART 1 — HOMEWORK PACK 1`,`Student: ${D.name}${D.group?' ('+D.group+')':''}`,`Teacher: A'zamjon Toxirov (C1)`,`Date: ${new Date().toLocaleString('en-GB')}`,``,
    `Completed: ${A.complete}/10 · Reading: ${A.score}/${A.n*6} (${A.acc}%) · ${lvl[0]}`,`Total time: ${fmtLong(A.time)} · Average: ${fmt(A.avg)} per test`,`Key Word Tables: ${A.kwPct!=null?A.kwPct+'%':'—'} · Left page: ${A.blurs} · UZ help: ${A.uz}`,``,
    ...TESTS.map(t=>{const d=D.tests[t.id]||{};const r=d.res,k=d.kwt;if(!r)return `T${t.id} ${t.title}: not done`;return `T${t.id} ${t.title}: ${r.score}/6 · ${fmt(r.time)}${k?' · KW '+Math.round((k.tFirst+k.hFirst)/(k.tTotal+k.hTotal)*100)+'%':''} · wrong: ${r.cat.map((c,i)=>c==='ok'?null:`${i+1}) ${r.ans[i]||'—'}`).filter(Boolean).join(', ')||'none'}`})].join('\n')}
function copyText(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied ✓ — paste it in Telegram')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied ✓')}catch(e){toast('Copy failed')}ta.remove()})}
function report(D){
  ui.mode='report';cur=null;
  view().innerHTML=`<div class="wrap anim">${reportHTML(D,{})}
    ${CLOUD_URL?`<div class="helper" style="margin-top:16px"><span class="hi">☁️</span><div><b>Your teacher can already see this report.</b><div class="uz"><span class="flag">UZ</span>Ustozingiz bu natijalarni o‘z panelida ko‘radi.</div></div></div>`:''}
    <div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn red big" id="rCopy">📋 Copy for teacher</button><button class="btn navy big" id="rPrint">🖨 Save as PDF</button></div>
    <p class="uz noprint"><span class="flag">UZ</span>“Copy” tugmasini bosing va matnni Telegramda ustozingizga yuboring, yoki PDF qilib saqlang.</p>
    <div class="footer">EDUNEST Academy · Teacher <b>A'zamjon Toxirov</b> (C1)</div></div>`;
  if(!stats(D).done.length){$('#rCopy').disabled=true}
  $('#rPrint').onclick=()=>window.print();$('#rCopy').onclick=()=>copyText(reportText(D));
}

/* ================== TEACHER ================== */
function localStudents(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(STORE+'s:')){try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.name)out.push(d)}catch(e){}}}}catch(e){}return out}
async function loadClass(force){
  if(TDATA&&!force)return TDATA;
  if(CLOUD_URL){try{const j=await cloudGet({action:'list',key:U.pass},15000);if(j.ok){TDATA={src:'cloud',list:j.students||[],at:Date.now()};return TDATA}TDATA={src:'error',err:j.error||'error',list:localStudents()};return TDATA}catch(e){TDATA={src:'error',err:'No connection',list:localStudents()};return TDATA}}
  TDATA={src:'local',list:localStudents(),at:Date.now()};return TDATA;
}
async function teacherHome(force){
  ui.mode='teacher';setBack(null);
  view().innerHTML=`<div class="wrap"><div class="loading" style="padding:60px"><div class="spin"></div>Loading students…</div></div>`;
  const C=await loadClass(force);if(ui.mode!=='teacher')return;
  const rows=C.list.map(D=>({D,A:analyse(D)}));
  const groups=[...new Set(C.list.map(d=>d.group).filter(Boolean))].sort();
  const f=ui.tf||(ui.tf={q:'',g:'',sort:'recent'});
  const active=rows.filter(r=>r.A.n);
  const clsAcc=active.length?Math.round(active.reduce((s,r)=>s+r.A.acc,0)/active.length):0;
  const totDone=rows.reduce((s,r)=>s+r.A.complete,0);
  const avgT=active.length?active.reduce((s,r)=>s+r.A.avg,0)/active.length:0;
  // per-test class average
  const per=TESTS.map(t=>{const rs=C.list.map(d=>d.tests[t.id]&&d.tests[t.id].res).filter(Boolean);return{t,n:rs.length,avg:rs.length?rs.reduce((s,r)=>s+r.score,0)/rs.length:null}});
  const W=520,H=170,bw=W/10;
  const perChart=`<svg class="chart" viewBox="0 0 ${W} ${H+50}">${TESTS.map((t,i)=>{const p=per[i];const h=p.avg!=null?Math.max(4,p.avg/6*H):0;const c=p.avg==null?'var(--track)':p.avg>=4.5?'#159947':p.avg>=3?'#D98A06':'#E3101F';
    return `${p.avg!=null?`<rect x="${i*bw+8}" y="${H-h+4}" width="${bw-16}" height="${h}" rx="6" style="fill:${c}"/><text x="${i*bw+bw/2}" y="${H-h-2}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--head)">${p.avg.toFixed(1)}</text>`:''}<text x="${i*bw+bw/2}" y="${H+24}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--mute)">T${t.id}</text><text x="${i*bw+bw/2}" y="${H+42}" text-anchor="middle" font-size="10" style="fill:var(--mute)">${p.n} st.</text>`}).join('')}</svg>`;
  const allCats={};active.forEach(r=>Object.entries(r.A.cats).forEach(([c,v])=>{if(c!=='ok')allCats[c]=(allCats[c]||0)+v}));
  const mc=Object.entries(allCats).sort((a,b)=>b[1]-a[1]);const mM=Math.max(1,...mc.map(m=>m[1]));
  const srcChip=C.src==='cloud'?`<span class="syncchip ok">☁️ Live from Google Sheet · ${C.list.length} students</span>`:C.src==='local'?`<span class="syncchip warn">💾 This device only — cloud not set up</span>`:`<span class="syncchip warn">⚠️ Cloud error: ${esc(C.err)} — showing this device</span>`;
  view().innerHTML=`<div class="wrap anim">
    <div class="eyebrow">Ustoz paneli · Teacher panel</div><h1>👨‍🏫 My students</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 4px">${srcChip}<button class="btn ghost" id="tRefresh" style="min-height:40px;padding:6px 14px">🔄 Refresh</button><button class="btn ghost" id="tCsv" style="min-height:40px;padding:6px 14px">⬇️ Excel (CSV)</button></div>
    ${C.src!=='cloud'?`<div class="setup"><b>To see every student's results here, connect the free Google Sheet</b> (5 minutes, once). Follow <b>SETUP.md</b>, then paste the web-app link into <code>CLOUD_URL</code> at the top of index.html. Until then, this panel only shows students who used <i>this</i> device.</div>`:''}
    <div class="kpis" style="margin-top:16px">
      <div class="card kpi"><div class="l">Students</div><div class="v">${rows.length}</div><div class="muted" style="font-size:12px;font-weight:600">${active.length} started</div></div>
      <div class="card kpi"><div class="l">Class accuracy</div><div class="v">${active.length?clsAcc+'%':'—'}</div><div class="bar"><b style="width:${clsAcc}%;background:var(--green)"></b></div></div>
      <div class="card kpi"><div class="l">Tests completed</div><div class="v">${totDone}</div><div class="muted" style="font-size:12px;font-weight:600">of ${rows.length*10}</div></div>
      <div class="card kpi"><div class="l">Avg time / test</div><div class="v">${active.length?fmt(avgT):'—'}</div></div>
    </div>
    <div class="two">
      <div class="card sec" style="margin-top:0"><h3>Class average per test</h3>${perChart}</div>
      <div class="card sec" style="margin-top:0"><h3>Most common mistakes</h3>${mc.length?mc.map(([c,v])=>`<div class="hbar"><span>${CAT[c][0]}</span><div class="tr"><b style="width:${v/mM*100}%;background:var(--red)"></b></div><b>${v}</b></div>`).join(''):'<p class="muted" style="margin-top:10px">No data yet.</p>'}</div>
    </div>
    <div class="tbar"><input id="tq" placeholder="🔎 Search name…" value="${esc(f.q)}"><select id="tg"><option value="">All groups</option>${groups.map(g=>`<option ${g===f.g?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <select id="ts"><option value="recent">Sort: last active</option><option value="score">Sort: accuracy</option><option value="progress">Sort: progress</option><option value="name">Sort: name A–Z</option><option value="growth">Sort: growth</option></select></div>
    <div style="overflow-x:auto"><table class="ttable"><thead><tr><th>Student</th><th>Progress</th><th>Accuracy</th><th class="hs">Avg time</th><th class="hm">Key Word</th><th class="hm">Growth</th><th class="hs">Last active</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="footer">EDUNEST Academy · Teacher panel · Multi Level Reading Part 1 · Pack 1</div></div>`;
  $('#ts').value=f.sort;
  const draw=()=>{let L=rows.filter(r=>(!f.g||r.D.group===f.g)&&(!f.q||r.D.name.toLowerCase().includes(f.q.toLowerCase())));
    const sorters={recent:(a,b)=>(b.D.updated||0)-(a.D.updated||0),score:(a,b)=>b.A.acc-a.A.acc,progress:(a,b)=>b.A.complete-a.A.complete,name:(a,b)=>a.D.name.localeCompare(b.D.name),growth:(a,b)=>(b.A.growth??-999)-(a.A.growth??-999)};L.sort(sorters[f.sort]);
    $('#tbody').innerHTML=L.length?L.map(({D,A})=>`<tr class="click" data-k="${esc(D.key)}"><td><div style="display:flex;align-items:center;gap:10px"><span class="av2" style="margin:0;flex:none">${esc(initials(D.name))}</span><div><b style="color:var(--head);line-height:1.2;display:block">${esc(D.name)}</b>${D.group?`<span class="muted" style="font-size:12.5px">${esc(D.group)}</span>`:''}</div></div></td>
      <td><b>${A.complete}/10</b><div class="minibar"><b style="width:${A.complete*10}%"></b></div></td>
      <td>${A.n?`<b style="color:${A.acc>=75?'var(--green)':A.acc>=55?'var(--amber)':'var(--red)'}">${A.acc}%</b><div class="muted" style="font-size:12px">${A.score}/${A.n*6}</div>`:'—'}</td>
      <td class="hs">${A.n?fmt(A.avg):'—'}</td><td class="hm">${A.kwPct!=null?A.kwPct+'%':'—'}</td>
      <td class="hm">${A.growth==null?'<span class="trend-flat">—</span>':A.growth>0?`<span class="trend-up">▲ +${A.growth}%</span>`:A.growth<0?`<span class="trend-down">▼ ${A.growth}%</span>`:'<span class="trend-flat">● 0%</span>'}</td>
      <td class="hs">${ago(D.updated)}</td></tr>`).join(''):`<tr><td colspan="7" style="text-align:center;padding:30px" class="muted">No students yet. When students log in and finish a test, they appear here.</td></tr>`;
    document.querySelectorAll('#tbody tr.click').forEach(tr=>tr.onclick=()=>go('#/teacher/s/'+encodeURIComponent(tr.dataset.k)));};
  draw();
  $('#tq').oninput=e=>{f.q=e.target.value;draw()};$('#tg').onchange=e=>{f.g=e.target.value;draw()};$('#ts').onchange=e=>{f.sort=e.target.value;draw()};
  $('#tRefresh').onclick=()=>teacherHome(true);
  $('#tCsv').onclick=()=>{const head=['Name','Group','Completed','Score','Accuracy %','Avg time','Total time','Key Word %','Growth %','Left page','Last active',...TESTS.map(t=>'T'+t.id)];
    const lines=[head,...rows.map(({D,A})=>[D.name,D.group||'',A.complete,A.score+'/'+A.n*6,A.n?A.acc:'',A.n?fmt(A.avg):'',A.n?fmt(A.time):'',A.kwPct??'',A.growth??'',A.blurs,D.updated?new Date(D.updated).toLocaleString('en-GB'):'',...TESTS.map(t=>{const r=D.tests[t.id]&&D.tests[t.id].res;return r?r.score:''})])];
    const csv='﻿'+lines.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='edunest-reading-p1-results.csv';a.click()};
}
async function teacherStudent(key){
  ui.mode='teacher-s';setBack('#/teacher','Barcha o‘quvchilar');
  const C=await loadClass();const D=C.list.find(d=>d.key===key);
  if(!D){view().innerHTML=`<div class="wrap"><div class="card sec"><h3>Student not found</h3><button class="btn red" onclick="go('#/teacher')">← All students</button></div></div>`;return}
  view().innerHTML=`<div class="wrap anim">${reportHTML(D,{teacher:true})}
    <div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn ghost big" id="sBack">← All students</button><div style="flex:1"></div><button class="btn red big" id="sCopy">📋 Copy report</button><button class="btn navy big" id="sPrint">🖨 PDF</button></div></div>`;
  $('#sBack').onclick=()=>go('#/teacher');$('#sPrint').onclick=()=>window.print();$('#sCopy').onclick=()=>copyText(reportText(D));
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const id=+b.dataset.reset;
    modal(`<h3>Reset Test ${id} for ${esc(D.name)}?</h3><p class="muted" style="margin-top:6px">The student will be able to do this test again. Their old result for it is deleted.</p>`,[{t:'Cancel'},{t:'↺ Reset',cls:'red',f:()=>{resetFor(D,id)}}])});
}
async function resetFor(D,id){
  delete D.tests[id];D.updated=Date.now();
  if(store(STORE+'s:'+D.key))store(STORE+'s:'+D.key,JSON.stringify(D));
  if(CLOUD_URL){try{await fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({action:'save',key:D.key,data:D})})}catch(e){toast('⚠️ Could not reach the cloud');return}}
  toast('Test '+id+' reset ✓');teacherStudent(D.key);
}

/* ================== START ================== */
(function start(){
  const tp=sstore(STORE+'tsession');
  if(tp&&sha256(tp)===TEACHER_PASS_SHA256){U={role:'teacher',pass:tp};enterApp();route();return}
  let s=null;try{s=JSON.parse(store(STORE+'session')||'null')}catch(e){}
  if(s&&s.role==='student'){const d=loadLocal(s.key);if(d){S=d;Object.values(S.tests).forEach(x=>{if(x.prog&&x.prog.seg)x.prog.seg=null});U=s;enterApp();route();
    syncFromCloud().then(ch=>{if(ch&&ui.mode==='home')home();else updSync()});return}}
  showLogin();
})();
</script>
